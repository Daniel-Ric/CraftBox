    Si quieres informar de este error, abre una incidencia en:
    https://github.com/Daniel-Ric/CraftBox/issues
    Adjunta los detalles del error, explica qué estabas haciendo cuando ocurrió y, si puedes, adjunta CraftBox.log.
    ¡Gracias!
used_extra_debug_report:
  other: |
    Aviso: extra-debug genera los archivos packets.log y packets.log.gpg.
    Si abres una incidencia, adjunta únicamente packets.log.gpg.
    Estos registros pueden contener datos de la cuenta, pero nunca credenciales de acceso. Usa el archivo cifrado.
    El desarrollador puede leer el archivo cifrado. Quienes visiten la incidencia pública no pueden hacerlo.
