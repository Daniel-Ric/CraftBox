report_issue:
  other: |
    Pour signaler cette erreur, ouvrez un ticket à l’adresse suivante :
    https://github.com/Daniel-Ric/CraftBox/issues
    Joignez les détails de l’erreur et décrivez les étapes qui l’ont provoquée. Si possible, joignez aussi le fichier CraftBox.log.
    Merci !
used_extra_debug_report:
  other: |
    Le mode extra-debug crée les fichiers packets.log et packets.log.gpg.
    Si vous ouvrez un ticket, joignez uniquement packets.log.gpg.
    Ces journaux peuvent contenir des informations sur votre compte, mais jamais vos identifiants de connexion. Utilisez le fichier chiffré.
    Le développeur peut lire le fichier chiffré. Les visiteurs du ticket public ne peuvent pas consulter son contenu.
