anti_cheat_notice:
  other: 'Une note avant de vous connecter : sur les serveurs avec un anti-cheat strict
    (Cubecraft et The Hive sont des cas connus), l''utilisation de CraftBox peut,
    dans des cas rares, faire être le compte marqué ou banni. Il se connecte via gophertunnel,
    qui ne se déplace pas ou ne transmet pas les entrées exactement comme le jeu réel,
    ce qui peut permettre à certains anti-cheats de le détecter. Pour ces serveurs,
    utilisez un compte alternatif ; Realms, vos propres mondes et la plupart des serveurs
    sont sans problème.'
