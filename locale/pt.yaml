    (Cubecraft e The Hive são casos conhecidos), usar CraftBox pode, em casos raros,
    resultar na flagra ou banimento da conta. O acesso é feito via gophertunnel, que
    não move ou envia entradas exatamente como o jogo real, o que pode ser detectado
    por alguns sistemas de anti-fraude. Para esses servidores, use uma conta alternativa;
    Realms, seus próprios mundos e a maioria dos servidores estão sem problemas.'
