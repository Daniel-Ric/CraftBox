    Se quiser relatar este erro, abra uma ocorrência em:
    https://github.com/Daniel-Ric/CraftBox/issues
    Inclua os detalhes do erro e descreva o que você estava fazendo quando ele aconteceu. Se possível, anexe também o arquivo CraftBox.log.
    Obrigado!
used_extra_debug_report:
  other: |
    O modo extra-debug gera os arquivos packets.log e packets.log.gpg.
    Ao relatar um problema, anexe somente packets.log.gpg.
    Esses logs podem conter informações da conta, mas nunca credenciais de acesso. Use o arquivo criptografado.
    O desenvolvedor pode ler o arquivo criptografado. Visitantes da ocorrência pública não podem acessar seu conteúdo.
