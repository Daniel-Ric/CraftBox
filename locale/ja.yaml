  other: |
    このエラーを報告する場合は、次のページで Issue を作成してください。
    https://github.com/Daniel-Ric/CraftBox/issues
    エラーの詳細と、発生時の操作手順をお知らせください。可能であれば CraftBox.log も添付してください。
    ご協力ありがとうございます。
used_extra_debug_report:
  other: |
    extra-debug を使用すると、packets.log と packets.log.gpg が作成されます。
    Issue を作成する際は、packets.log.gpg だけを添付してください。
    ログにはアカウント情報が含まれる場合がありますが、サインインの認証情報は含まれません。暗号化されたファイルを使用してください。
    暗号化されたファイルは開発者だけが読めます。公開 Issue の閲覧者には内容は表示されません。
