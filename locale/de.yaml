report_issue:
  other: |
    Wenn du diesen Fehler melden möchtest, öffne hier einen neuen Fehlerbericht:
    https://github.com/Daniel-Ric/CraftBox/issues
    Füge die Fehlermeldung hinzu und beschreibe, wie der Fehler aufgetreten ist. Hänge nach Möglichkeit auch die Datei CraftBox.log an.
    Vielen Dank!
used_extra_debug_report:
  other: |
    Du hast extra-debug verwendet. Dabei entstehen die Dateien packets.log und packets.log.gpg.
    Hänge an einen Fehlerbericht bitte nur packets.log.gpg an.
    Die Protokolle können Kontoinformationen enthalten, aber keine Anmeldedaten. Verwende daher die verschlüsselte Datei.
    Der Entwickler kann die verschlüsselte Datei lesen. Besucher des öffentlichen Fehlerberichts können ihren Inhalt nicht einsehen.
