<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/craft-box-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CraftBox</title>
    <script>
      try {
        const saved = localStorage.getItem("CraftBox-theme");
        const light = saved === "light" || (saved === "system" && !matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", !light);
        document.documentElement.dataset.theme = light ? "light" : "dark";
        document.documentElement.style.colorScheme = light ? "light" : "dark";
      } catch {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
