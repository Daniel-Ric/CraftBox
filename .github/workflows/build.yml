name: CraftBox Build

on:
  push:
    branches: ['**']
    tags: ['v[0-9]*', 'r[0-9]*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (X.Y.Z; empty uses VERSION)
        type: string
        default: ''
      publish:
        description: Publish a Stable release from master or a Preview prerelease from preview
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: CraftBox-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  metadata:
    name: Build metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      build_tag: ${{ steps.metadata.outputs.build_tag }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      publish: ${{ steps.metadata.outputs.publish }}
      channel: ${{ steps.metadata.outputs.channel }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      make_latest: ${{ steps.metadata.outputs.make_latest }}
      published_releases: ${{ steps.releases.outputs.result }}
      unlock_packs: ${{ steps.metadata.outputs.unlock_packs }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test CI metadata
        run: node --test .github/scripts/ci-metadata.test.cjs
      - name: Select CraftBox version
        id: metadata
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          REPO_KEY: ${{ github.event_name != 'pull_request' && secrets.REPO_KEY || '' }}
        run: node .github/scripts/ci-metadata.cjs
      - name: Read published release baselines
        id: releases
        uses: actions/github-script@v9
        with:
          result-encoding: string
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 });
            return JSON.stringify(releases.filter(release => !release.draft).map(release => ({ tag: release.tag_name, prerelease: release.prerelease })));

  build:
    name: Build ${{ matrix.artifact }}
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: windows
            arch: ''
            artifact: windows
          - runner: ubuntu-24.04
            target: linux
            arch: ''
            artifact: linux
          - runner: macos-15
            target: darwin
            arch: arm64
            artifact: macos-arm64
          - runner: macos-15-intel
            target: darwin
            arch: amd64
            artifact: macos-amd64
    env:
      CRAFTBOX_VERSION: ${{ needs.metadata.outputs.version }}
      CRAFTBOX_BUILD_TAG: ${{ needs.metadata.outputs.build_tag }}
      CRAFTBOX_PUBLISHED_RELEASES: ${{ needs.metadata.outputs.published_releases }}
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.sum
            go.work.sum
            dragonfly/go.sum
            go-nethernet/go.sum
            go-playfab/go.sum
            go-xsapi/go.sum
            gophertunnel/go.sum
            webrtc/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/desktop/frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y git-crypt gcc pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
          pkg-config --exists gtk+-3.0 gio-unix-2.0 webkit2gtk-4.1 libsoup-3.0
      - name: Install optional Windows pack tooling
        if: github.event_name != 'pull_request' && runner.os == 'Windows' && needs.metadata.outputs.unlock_packs == 'true'
        uses: msys2/setup-msys2@v2
        with:
          release: false
          path-type: inherit
          install: git-crypt
      - name: Unlock optional packs on Windows
        if: github.event_name != 'pull_request' && runner.os == 'Windows' && needs.metadata.outputs.unlock_packs == 'true'
        shell: msys2 {0}
        env:
          REPO_KEY: ${{ secrets.REPO_KEY }}
        run: node .github/scripts/unlock-packs.cjs
      - name: Install optional macOS pack tooling
        if: github.event_name != 'pull_request' && runner.os == 'macOS' && needs.metadata.outputs.unlock_packs == 'true'
        run: brew install git-crypt
      - name: Unlock optional packs on Linux and macOS
        if: github.event_name != 'pull_request' && runner.os != 'Windows' && needs.metadata.outputs.unlock_packs == 'true'
        env:
          REPO_KEY: ${{ secrets.REPO_KEY }}
        run: node .github/scripts/unlock-packs.cjs
      - name: Download Go dependencies
        run: go mod download
      - name: Prepare verified Minecraft runtime assets
        run: |
          python tools/prepare-ci-assets.py
          go run ./tools/bundle-assets
      - name: Build frontend
        working-directory: ui/desktop/frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Check build script and public Go packages
        run: |
          go test build.go
          go test ./cmd/CraftBox ./handlers/... ./internal/... ./subcommands ./ui/desktop ./ui/messages ./utils/... ./locale
      - name: Test native Windows desktop
        if: runner.os == 'Windows'
        run: go test -tags gui ./ui/desktop
      - name: Test native Linux desktop
        if: runner.os == 'Linux'
        run: go test -tags gui,webkit2_41 ./ui/desktop
      - name: Build CraftBox CLI and desktop
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: go run ./build.go "$BUILD_TARGET" gui,cli "$BUILD_ARCH"
      - name: Check dependency files remain unchanged
        run: |
          git diff --exit-code --ignore-submodules=dirty -- go.mod go.sum go.work go.work.sum dragonfly go-nethernet go-playfab go-xsapi gophertunnel webrtc
          for module in dragonfly go-nethernet go-playfab go-xsapi gophertunnel webrtc; do
            git -C "$module" diff --exit-code HEAD -- go.mod go.sum
          done
      - name: Upload CraftBox builds
        uses: actions/upload-artifact@v7
        with:
          name: CraftBox-${{ matrix.artifact }}-${{ needs.metadata.outputs.build_tag }}
          path: |
            builds/*
            changelog.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish CraftBox release
    needs: [metadata, build]
    if: github.event_name != 'pull_request' && needs.metadata.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: CraftBox-release-${{ needs.metadata.outputs.channel }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check publication is still current
        id: current
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
          RELEASE_CHANNEL: ${{ needs.metadata.outputs.channel }}
        with:
          result-encoding: string
          script: |
            const { publicationAllowed } = require('./.github/scripts/release-policy.cjs');
            return String(await publicationAllowed({ github, context, core, tag: process.env.RELEASE_TAG, channel: process.env.RELEASE_CHANNEL }));
      - uses: actions/download-artifact@v8
        if: steps.current.outputs.result == 'true'
        with:
          pattern: CraftBox-*
          merge-multiple: true
          path: release
      - name: Create or update release tag
        if: steps.current.outputs.result == 'true'
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            try {
              const { data } = await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` });
              if (data.object.sha !== context.sha) {
                const resolved = await github.rest.repos.getCommit({ ...context.repo, ref: `refs/tags/${tag}` });
                if (resolved.data.sha !== context.sha) throw new Error(`Release tag ${tag} already belongs to another commit.`);
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({ ...context.repo, ref: `refs/tags/${tag}`, sha: context.sha });
            }
      - name: Upload release draft
        id: draft
        if: steps.current.outputs.result == 'true'
        uses: ncipollo/release-action@v1
        with:
          name: CraftBox ${{ needs.metadata.outputs.build_tag }}
          tag: ${{ needs.metadata.outputs.release_tag }}
          commit: ${{ github.sha }}
          prerelease: ${{ needs.metadata.outputs.prerelease }}
          artifacts: release/builds/*
          bodyFile: release/changelog.txt
          artifactErrorsFailBuild: true
          draft: true
          skipIfReleaseExists: true
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          makeLatest: ${{ needs.metadata.outputs.make_latest }}
      - name: Publish complete release
        if: steps.current.outputs.result == 'true'
        uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ steps.draft.outputs.id }}
          RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
          RELEASE_CHANNEL: ${{ needs.metadata.outputs.channel }}
        with:
          script: |
            const { publicationAllowed } = require('./.github/scripts/release-policy.cjs');
            const channel = process.env.RELEASE_CHANNEL;
            if (!await publicationAllowed({ github, context, core, tag: process.env.RELEASE_TAG, channel })) return;
            const releaseId = Number(process.env.RELEASE_ID);
            if (!Number.isSafeInteger(releaseId) || releaseId <= 0) throw new Error('No completed release draft was returned.');
            await github.rest.repos.updateRelease({ ...context.repo, release_id: releaseId, draft: false, prerelease: channel === 'preview', make_latest: channel === 'stable' ? 'true' : 'false' });
