name: ci-build
on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    steps:
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-crypt xxd gcc pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
          pkg-config --exists gtk+-3.0 gio-unix-2.0 webkit2gtk-4.1 libsoup-3.0

      - name: Setup Golang with cache
        uses: magnetikonline/action-golang-cache@v3
        with:
          go-version: ~1.26

      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - run: |
          git fetch --force --tags

      - name: decrypt
        if: ${{ env.REPO_KEY != '' }}
        run: |
          echo ${REPO_KEY} | xxd -r -p > ../bedrock-repo-key.key
          git status --porcelain
          git-crypt unlock ../bedrock-repo-key.key
          rm ../bedrock-repo-key.key
        env:
          REPO_KEY: ${{ secrets.REPO_KEY }}

      - name: dependencies
        run: |
          go get ./cmd/CraftBox

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/desktop/frontend/package-lock.json

      - name: frontend
        working-directory: ui/desktop/frontend
        run: |
          npm ci
          npm test

      - name: build
        id: build
        run: |
          go run ./build.go windows,linux gui,cli

      - name: 🏷️ Create/update tag
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/${{ steps.build.outputs.release_tag }}',
              sha: context.sha
            }).catch(err => {
              if (err.status !== 422) throw err;
              github.rest.git.updateRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'tags/${{ steps.build.outputs.release_tag }}',
                sha: context.sha
              });
            })

      - uses: ncipollo/release-action@v1
        with:
          artifacts: ./builds/*
          bodyFile: changelog.txt
          removeArtifacts: true
          replacesArtifacts: true
          allowUpdates: true
          makeLatest:  ${{ steps.build.outputs.is_latest }}
          tag: ${{ steps.build.outputs.release_tag }}
